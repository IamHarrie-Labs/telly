name: Uptime and watching

# Scheduled every ten minutes, though GitHub often starts scheduled runs hours apart: check the
# live site is up, then run background watching. Each run only checks the organisers who are due.
# GitHub emails the repository owner when a scheduled run fails, so this doubles as the
# uptime alert. Needs one repository secret, CRON_SECRET, matching the one in Vercel.
on:
  schedule:
    - cron: '2-59/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Health check
        run: |
          code=$(curl -s -o health.json -w '%{http_code}' --max-time 20 https://usetelly.xyz/api/health)
          cat health.json; echo
          test "$code" = 200
      - name: Run background watching
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set; skipping."; exit 0; fi
          curl -sf --max-time 90 -H "Authorization: Bearer $CRON_SECRET" https://usetelly.xyz/api/cron/watch
